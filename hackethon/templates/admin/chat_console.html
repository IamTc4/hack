{% extends 'includes/_base.html' %}

{% block title %}Admin Chat Console{% endblock %}

{% block content %}
<div class="container">
    <h1 class="text-center">Live Chat & Poll Console</h1>
    <div class="row mt-4">
        <div class="col-md-6">
            <h3>Send a Message</h3>
            <form method="POST" action="{{ url_for('chat.admin_chat') }}">
                <input type="hidden" name="type" value="message">
                <div class="mb-3">
                    <label for="messageContent" class="form-label">Message</label>
                    <textarea class="form-control" id="messageContent" name="content" rows="3" required></textarea>
                </div>
                <button type="submit" class="btn btn-primary">Send Message</button>
            </form>
        </div>
        <div class="col-md-6">
            <h3>Push a Question/Poll</h3>
            <form method="POST" action="{{ url_for('chat.admin_chat') }}">
                <input type="hidden" name="type" value="question">
                <div class="mb-3">
                    <label for="questionContent" class="form-label">Question</label>
                    <input type="text" class="form-control" id="questionContent" name="content" required>
                </div>
                <button type="submit" class="btn btn-success">Push Question</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
