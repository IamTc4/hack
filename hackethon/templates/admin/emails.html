{% extends 'includes/_base.html' %}

{% block title %}Email System{% endblock %}

{% block content %}
<div class="container">
    <h1 class="text-center">Email System</h1>
    <div class="row mt-4">
        <div class="col-12 text-end">
            <a href="{{ url_for('email.create_email') }}" class="btn btn-primary">Create Email</a>
        </div>
    </div>
    <div class="table-responsive mt-4">
        <table class="table table-dark table-striped table-hover">
            <thead>
                <tr>
                    <th scope="col">Subject</th>
                    <th scope="col">Recipient Group</th>
                    <th scope="col">Actions</th>
                </tr>
            </thead>
            <tbody>
                {% for draft in drafts %}
                <tr>
                    <td>{{ draft.subject }}</td>
                    <td>{{ draft.recipient_group }}</td>
                    <td>
                        <a href="{{ url_for('email.edit_email', draft_id=draft.id) }}" class="btn btn-sm btn-warning">Edit</a>
                        <form action="{{ url_for('email.delete_email', draft_id=draft.id) }}" method="POST" class="d-inline">
                            <button type="submit" class="btn btn-sm btn-danger">Delete</button>
                        </form>
                        <form action="{{ url_for('email.send_email', draft_id=draft.id) }}" method="POST" class="d-inline">
                            <button type="submit" class="btn btn-sm btn-success">Send</button>
                        </form>
                    </td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</div>
{% endblock %}
