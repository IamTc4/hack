{% extends 'includes/_base.html' %}

{% block title %}System Settings{% endblock %}

{% block content %}
<div class="container">
    <h1 class="text-center">System Settings</h1>
    {% with messages = get_flashed_messages() %}
        {% if messages %}
            <div class="alert alert-success">{{ messages[0] }}</div>
        {% endif %}
    {% endwith %}
    <form method="POST" action="{{ url_for('admin.settings') }}">
        <div class="mb-3">
            <label for="youtube_url" class="form-label">YouTube Live URL</label>
            <input type="url" class="form-control" id="youtube_url" name="youtube_url" value="{{ youtube_url }}" placeholder="e.g., https://www.youtube.com/watch?v=dQw4w9WgXcQ">
        </div>
        <div class="mb-3">
            <label for="countdown_time" class="form-label">Live Countdown Target (YYYY-MM-DD HH:MM:SS)</label>
            <input type="datetime-local" class="form-control" id="countdown_time" name="countdown_time" value="{{ countdown_time }}">
        </div>
        <button type="submit" class="btn btn-primary">Save Settings</button>
    </form>
</div>
{% endblock %}
