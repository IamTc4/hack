<!DOCTYPE html>
<html>
<head>
    <title>Manage Winners</title>
</head>
<body>
    <h1>Manage Winners</h1>
    <a href="{{ url_for('admin.add_winner') }}">Add New Winner</a>
    <table>
        <thead>
            <tr>
                <th>Name</th>
                <th>Class</th>
                <th>Event</th>
                <th>Medal</th>
            </tr>
        </thead>
        <tbody>
            {% for winner in winners %}
            <tr>
                <td>{{ winner.name }}</td>
                <td>{{ winner.class_name }}</td>
                <td>{{ winner.event.name }}</td>
                <td>{{ winner.medal }}</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
    <br>
    <a href="{{ url_for('admin.dashboard') }}">Back to Dashboard</a>
</body>
</html>
